[workspace]
resolver = "2"
members = [
    "crates/foreplay-ir",
    "crates/foreplay-core",
    "crates/foreplay-platform",
    "crates/foreplay-render",
    "crates/foreplay-physics",
    "crates/foreplay-audio",
    "crates/foreplay-net",
    "crates/foreplay-script",
    "crates/foreplay-gdscript",
    "crates/foreplay-gdext",
    "crates/foreplay-atlas",
    "crates/foreplay-harness",
    "crates/foreplay-porthost",
    "crates/foreplay-polyamour",
    "crates/foreplay-threejs",
    "crates/foreplay-export",
    "crates/foreplay-player",
    "crates/foreplay-editor",
    "crates/foreplay-verifier",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/xirtus/Foreplay"
homepage = "https://sexos.dev"

[workspace.dependencies]
# Principle #1 (from 3JSE): Bevy is an upgradable modular substrate, NEVER a fork.
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "bevy_reflect"] }
bevy_reflect = { version = "0.20.1", default-features = false, features = ["std"] }
bevy_math = { version = "0.20.1", default-features = false, features = ["std", "alloc"] }

# Serialization & Errors
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

# Hardware GPU, Windowing & Textures (Metal / Vulkan / DX12 / WebGPU)
wgpu = "30.0.2"
egui-wgpu = "0.36.2"
winit = "0.30.13"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "hdr", "tga", "bmp"] }
libloading = "0.8.9"

# Production 2D & 3D Physics (Rapier alongside PortFaithful live hotswap)
rapier2d = { version = "0.36.1", features = ["enhanced-determinism", "serde-serialize"] }
rapier3d = { version = "0.36.1", features = ["enhanced-determinism", "serde-serialize"] }

# Real-Time OS Audio I/O, Multi-Codec Decoding, Gamepad Input, glTF 2.0 & Unicode Shaping
cpal = "0.18.2"
symphonia = { version = "0.6.1", default-features = false, features = ["pcm", "wav", "ogg", "vorbis", "mp3", "flac"] }
gilrs = "0.11.2"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "KHR_lights_punctual", "KHR_materials_unlit", "KHR_materials_emissive_strength", "extras"] }
cosmic-text = "0.19.0"

# Editor UI Foundation (Linux/Wayland/X11/SteamDeck, macOS, Windows, WebGPU & SexOS egui backend)
egui = "0.36"
eframe = { version = "0.36", default-features = true }
egui_dock = "0.21.1"

# Adversarial Verification & Property Testing (Track E Carbon Verifier)
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "warn"
todo = "warn"
